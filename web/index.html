<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F4F0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Margin — a daily allowance for social media, with a calm lock screen when it's spent.">
  <title>Margin</title>
  <!-- data-css: the Android build also ships css-dark/ copies for WebViews without CSS variables. -->
  <link rel="stylesheet" href="css/tokens.css" data-css>
  <link rel="stylesheet" href="css/base.css" data-css>
  <link rel="stylesheet" href="css/components.css" data-css>
  <link rel="stylesheet" href="css/screens.css" data-css>
  <link rel="stylesheet" href="css/onboarding.css" data-css>
  <link rel="stylesheet" href="css/legacy.css" data-css>
</head>
<body>
  <div class="device" id="device">
    <main class="viewport" id="viewport" aria-live="polite"></main>
    <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
    <div class="sheet-layer" id="sheet-layer"></div>
    <div class="onboarding-layer" id="onboarding-layer"></div>
    <div class="lockout-layer" id="lockout-layer" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/native.js"></script>
  <script src="js/store.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/components.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/apps.js"></script>
  <script src="js/screens/stats.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/screens/lockout.js"></script>
  <script src="js/screens/onboarding.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
